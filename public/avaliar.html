<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enviar avalia&ccedil;&atilde;o | Ver&atilde;o Reviews</title>
    <link rel="stylesheet" href="/admin.css">
  </head>
  <body class="public-review-page">
    <main class="review-submit-shell">
      <section class="review-submit-card">
        <div class="review-submit-intro">
          <p class="eyebrow">Ver&atilde;o em Cores</p>
          <h1>Mostre como ficou no corpo</h1>
          <p class="sub">Envie sua avalia&ccedil;&atilde;o real com foto. Depois de aprovada, ela aparece na p&aacute;gina do produto e ajuda outras clientes a comprar com confian&ccedil;a.</p>
        </div>

        <form id="publicReviewForm" class="login-form">
          <label>
            Seu nome
            <input name="customerName" required placeholder="Ex: Ana Paula">
          </label>

          <label>
            Produto comprado
            <input name="productName" required>
          </label>

          <input name="productUrl" type="hidden">
          <input name="productSlug" type="hidden">

          <label>
            Nota
            <select name="rating">
              <option value="5">5 estrelas</option>
              <option value="4">4 estrelas</option>
              <option value="3">3 estrelas</option>
              <option value="2">2 estrelas</option>
              <option value="1">1 estrela</option>
            </select>
          </label>

          <label>
            Coment&aacute;rio
            <textarea name="comment" required rows="5" placeholder="Conte o que voce achou do tecido, tamanho e caimento"></textarea>
          </label>

          <label>
            Foto do produto
            <input name="photo" type="file" accept="image/*" required>
          </label>

          <button class="button" type="submit">Enviar avalia&ccedil;&atilde;o</button>
          <p id="publicReviewMessage" class="message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script type="module" src="/avaliar.js"></script>
  </body>
</html>
